[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "particle-sliders-ltx25-modern-preview"
version = "0.2.0"
description = "Opt-in CPU-qualified experimental LTX video-field GAN cohort"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "hndl==0.10.0",
  "hypergan @ git+https://github.com/HyperGAN/HyperGAN.git@5f368a3770cf5bdae0448995c9f76e29af8049f7",
  "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@ec1161f5d74481be3540cb0dfa63d0e8f8b54e90#subdirectory=packages/particle-sliders-core",
]

[project.entry-points."particle_sliders.response_backends"]
ltx25-dummy-video-gan-preview = "particle_sliders_ltx25_dummy_preview.binding:backend"

[project.entry-points."particle_sliders.inference_backends"]
ltx25-dummy-video-gan-preview = "particle_sliders_ltx25_dummy_preview.binding:inference_backend"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["particle_sliders_ltx25_dummy_preview"]

[tool.setuptools.package-data]
particle_sliders_ltx25_dummy_preview = ["*.hndl", "*.json"]
